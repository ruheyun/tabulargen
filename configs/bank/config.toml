data_path = "data/bank"
exp_path = "exp/bank"
device = "cuda:0"
seed = 0

[model_params]
d_in = 16
is_y_cond = true
num_classes = 2

[model_params.rtdl_params]
d_layers = [
    512,
    1024,
    1024,
    512,
]
dropout = 0.0

[diffusion_params]
num_timesteps = 1000
gaussian_loss_type = "mse"
scheduler = "cosine"

[train.main]
epochs = 300
lr = 0.0005910317077425306
weight_decay = 0.0
batch_size = 256

[sample]
num_samples = 6000
batch_size = 256
seed = 4

[eval.type]
eval_model = "catboost"
eval_type = "synthetic"

[dp]
is_dp = false
epsilon = 1
sigma = 2.890625
max_grad_norm = 1.0
delta = 1e-05
noise_multiplicity_K = 3
