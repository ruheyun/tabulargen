seed = 0
device = "cuda:0"

[data]
path = "data/bank"

[experiment]
path = "exp/bank/run_10"

[encoding]
num_encoder = "minmax"
cat_encoder = "alb"
seed = 42

[model]
is_y_cond = true
num_classes = 2

[model.rtdl_params]
d_layers = [
    512,
    1024,
    1024,
    512,
]
dropout = 0.0
activation = 'SiLU'

[diffusion]
num_timesteps = 1000
gaussian_loss_type = "mse"
scheduler = "cosine"

[train]
seed = 0
num_workers = 2
epochs = 300
lr = 1e-4
weight_decay = 0.0
batch_size = 256

[sample]
seed = 4
class_distribution = "empirical"
num_samples = 6000
batch_size = 256

[evaluation]
seed = 0
models = ['catboost', 'tree', 'rf', 'lr', 'mlp']
mode = "synthetic"
catboost_params_path = "configs/bank/catboost.json"

[privacy]
is_dp = false
epsilon = 1.0
max_grad_norm = 1.0
delta = 1e-05
