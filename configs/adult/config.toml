data_path = "data/adult"
exp_path = "exp/adult"
device = "cuda:0"
seed = 0

[model_params]
is_y_cond = true
num_classes = 2

[model_params.rtdl_params]
d_layers = [
    512,
    1024,
    1024,
    512,
]
dropout = 0.0

[diffusion_params]
num_timesteps = 1000
gaussian_loss_type = "mse"
scheduler = "cosine"

[train.main]
epochs = 300
lr = 0.0024384255846226824   # No-dp: 0.0024384255846226824    0.00011205837185064171   0.00039806870482992913
weight_decay = 0.0
batch_size = 256

[sample]
num_samples = 29305
batch_size = 256
seed = 4

[eval.type]
eval_model = "catboost"
eval_type = "synthetic"

[dp]
is_dp = false
epsilon = 1.0
sigma = 1.9140625
max_grad_norm = 1.0
delta = 1e-05
