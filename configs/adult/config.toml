seed = 0
device = "cuda:0"

[data]
path = "data/adult"

[experiment]
path = "exp/adult/run_00"

[encoding]
num_encoder = "minmax"
cat_encoder = "alb"
seed = 42


[model]
is_y_cond = true
num_classes = 2

[model.rtdl_params]
d_layers = [
    512,
    1024,
    1024,
    512,
]
dropout = 0.0
activation = 'SiLU'

[diffusion]
num_timesteps = 1000
gaussian_loss_type = "mse"
scheduler = "cosine"

[train]
seed = 0
num_workers = 2
epochs = 300
lr = 0.0024384255846226824   # No-dp: 0.0024384255846226824    0.00011205837185064171   0.00039806870482992913
weight_decay = 0.0
batch_size = 256

[sample]
seed = 4
class_distribution = "empirical"
num_samples = 29305
batch_size = 256

[evaluation]
seed = 0
mode = "synthetic"
catboost_params_path = "catboost.json"

[privacy]
is_dp = false
epsilon = 1.0
max_grad_norm = 1.0
delta = 1e-05
